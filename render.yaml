# Render Blueprint for the PACT FastAPI team demo (synthetic data only).
# No secrets in this file: PACT_DEMO_PASSWORD is entered in the Render dashboard.
services:
  - type: web
    name: pact-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Uvicorn runs a single worker by default, which the in-memory demo dataset requires.
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PACT_DEMO_PASSWORD
        sync: false # prompted for in the Render dashboard; never stored in git
      - key: PACT_SESSION_SECRET
        generateValue: true # random value generated by Render
