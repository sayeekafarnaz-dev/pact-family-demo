@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap');
:root{--q-navy:#00132D;--q-olive:#626B3B;--q-paper:#F7F6F2;--q-gold:#D5B16C;--q-ink:#142d39}
body{background:var(--q-paper);color:var(--q-ink);font-family:'DM Sans',system-ui,sans-serif}
.pact-app-shell{max-width:1530px}.pact-app-shell .top{background:var(--q-paper);border:1px solid #dcded5;box-shadow:0 4px 20px #00132d0c}
.pact-app-shell .top strong,.hero h1{font-family:'DM Serif Display',Georgia,serif;letter-spacing:-.025em!important;font-weight:400}
.pact-app-shell .top strong{font-size:32px!important;color:var(--q-navy)}
.pact-app-shell .top strong span,.hero h1 span{color:var(--q-olive)!important}
.pact-sidebar{background:var(--q-navy);border:1px solid #26394f;box-shadow:0 16px 35px #00132d24}
.pact-sidebar-label{color:#c8bd9c}.pact-side-link{color:#eceee8;font-family:'DM Sans',system-ui,sans-serif}
.pact-side-link:hover,.pact-side-link:focus-visible{background:#1e344a;color:white}
.pact-side-link.is-active{background:var(--q-gold);color:var(--q-navy)}
.pact-side-children{border-left-color:#8d9678}.pact-side-children .pact-side-sub.is-active{background:#e9e6d7;color:var(--q-navy)}
.pact-app-shell .card,.pact-plan-foundation,.pact-pillar,.pact-modal{background:#fffefa;border-color:#e0e1d9;border-radius:16px;box-shadow:0 5px 18px #00132d0a}
.pact-app-shell main>h1,.pact-app-shell main h2,.pact-plan-teaser h2,.pact-modal h2{font-family:'DM Serif Display',Georgia,serif;letter-spacing:-.015em;font-weight:400}
.pact-app-shell main>h1{color:var(--q-navy);font-size:clamp(30px,3.2vw,43px)}
.pact-plan-teaser,.pact-plan-center{background:linear-gradient(115deg,var(--q-navy),#183d42);border:1px solid #27474a}
.pact-plan-teaser button,.pact-app-shell .pact-drive-button{background:#f0e9d8;color:var(--q-navy);border-color:#ddcda8}
.pact-plan-teaser button:hover,.pact-app-shell .pact-drive-button:hover{background:#e9dab7}
.pact-eyebrow{color:var(--q-gold)}
.pact-app-shell main button:not(.pact-side-link):focus-visible{outline:2px solid var(--q-olive);outline-offset:2px}
.pact-pillar:hover,.pact-pillar.selected{background:#f2f1e7;border-color:var(--q-olive)}
.pact-avatar-face{background:#f2e9d5;border-color:var(--q-gold)}
.pact-family-board{border-top-color:var(--q-gold)}
.pact-score-card{background:#f5f4ed;color:var(--q-navy);border-color:#dcded2}
.pact-score-card:hover{background:#eeeee1;outline-color:var(--q-olive)}
.pact-drive-mark{background:#e4e5d6;color:var(--q-olive)}
.packd-pride-art{background:linear-gradient(140deg,#f1e9d6,#e3d3ad,#e5e8db);border:1px solid #e1d1aa}
.hero{background:var(--q-navy);color:#f7f6f2}.hero h1{color:#f7f6f2}
.hero button{background:var(--q-gold);color:var(--q-navy)}
.pact-app-shell .pact-plan-teaser{box-shadow:0 12px 26px #00132d19}
@media(max-width:900px){.pact-sidebar{background:var(--q-navy)}}
/* packd. art direction — Qlogue typography, disciplined hierarchy, and savannah illustration */
.pact-app-layout{grid-template-columns:230px minmax(0,1fr);gap:24px}
.pact-sidebar{padding:17px 12px;border-radius:17px;gap:3px;box-shadow:0 10px 30px #00132d14}
.pact-sidebar-label{font-size:10px;letter-spacing:.12em;padding:12px 12px 13px;color:#b5bfaa}
.pact-side-link{font-size:13px;min-height:41px;padding:10px 13px;border-radius:9px;line-height:1.25;transition:background .15s}
.pact-side-category{min-height:43px}
.pact-side-link.is-active{background:#dce4cc;color:#00132d}
.pact-side-children{margin:0 0 10px 15px;padding:3px 0 3px 10px;border-left:1px solid #637469}
.pact-side-children .pact-side-sub{min-height:35px;padding:8px 10px;font-size:12px;font-weight:500;color:#d3ded6}
.pact-side-children .pact-side-sub.is-active{background:#e9e6d7;color:#00132d;font-weight:700}
.pact-side-arrow{font-size:16px!important;font-weight:400}
.pact-sidebar .pact-drive-button{margin-top:18px;padding:11px 9px;border-radius:12px;min-width:0;max-width:none;width:100%;gap:8px;box-shadow:none}
.pact-sidebar .pact-drive-button strong{font-size:12px;line-height:1.2}
.pact-sidebar .pact-drive-button small{font-size:10px;line-height:1.4}
.pact-sidebar .pact-drive-mark{width:37px;height:37px;flex:0 0 37px;background:white}
.pact-sidebar .pact-drive-button>span:last-child{font-size:13px;margin-left:auto}
.pact-plan-teaser{position:relative;overflow:hidden;min-height:280px;align-items:center;padding:28px 32px;background:linear-gradient(105deg,#00132d 0%,#0c303a 54%,#3c5743 100%);isolation:isolate}
.pact-plan-teaser .packd-plan-copy{position:relative;z-index:2;max-width:56%}
.pact-plan-teaser h2{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(26px,2.8vw,38px);line-height:1.12;color:#f7f6f2}
.pact-plan-teaser p{font-size:14px;line-height:1.6}
.pact-plan-teaser>button{position:relative;z-index:3;align-self:flex-end;margin-bottom:6px}
.packd-pride-illustration{position:absolute;right:0;top:0;bottom:0;width:48%;z-index:1;background-image:linear-gradient(90deg,#0c303a 0%,transparent 32%),url('/static/packd-pride.svg');background-size:cover;background-position:center;pointer-events:none}
@media(max-width:1100px){.pact-plan-teaser .packd-plan-copy{max-width:65%}.packd-pride-illustration{width:45%;opacity:.75}}
@media(max-width:900px){.pact-app-layout{grid-template-columns:1fr}.pact-sidebar{position:relative;flex-direction:column;align-items:stretch;max-height:none;overflow:visible}.pact-side-group{width:100%}.pact-sidebar-label{display:block}.pact-side-children{margin-left:16px}.pact-side-children .pact-side-sub{white-space:normal}.pact-sidebar>.pact-side-link{width:100%}.pact-sidebar .pact-drive-button{width:100%;max-width:none}.pact-plan-teaser{min-height:270px}.pact-plan-teaser .packd-plan-copy{max-width:75%}}
@media(max-width:600px){.pact-plan-teaser{padding:22px;min-height:300px;display:block}.pact-plan-teaser .packd-plan-copy{max-width:100%}.packd-pride-illustration{width:100%;opacity:.25}.pact-plan-teaser>button{margin-top:16px}}
.packd-avatar-art{display:inline-flex;width:55px;height:55px;flex-shrink:0;vertical-align:middle;border-radius:50%;overflow:hidden;box-shadow:0 2px 9px #00132d1a;border:2px solid #d5b16c}.packd-avatar-art svg{width:100%;height:100%}.packd-avatar-art.cub{width:51px;height:51px}.packd-avatar-art.lioness{border-color:#a8ad84}.packd-pride-art{width:min(430px,100%);padding:0;overflow:hidden}.packd-pride-art img{display:block;width:100%;height:auto}.pact-avatar-tile .packd-avatar-art{margin:auto} </style></head><body><div id="root"></div>
<script>
const people=[{id:'dad',name:'Daniel',age:63,role:'Dad',icon:'🦁',goal:6000,saved:4200},{id:'mum',name:'Amira',age:58,role:'Mum',icon:'🐾',goal:4000,saved:2600},{id:'daughter',name:'Maya',age:31,role:'Daughter',icon:'🐾',goal:3000,saved:1200},{id:'son',name:'Leo',age:8,role:'Son',icon:'🦁',goal:200,saved:110},{id:'grandma',name:'Nora',age:67,role:'Grandma',icon:'🐾',goal:1500,saved:900},{id:'grandpa',name:'Arthur',age:82,role:'Grandpa',icon:'🦁',goal:1000,saved:300}];
const initial={started:false,step:0,account:'',family:'The Morgan Family',viewer:'dad',tab:'home',privacy:{dad:'summary',mum:'summary',daughter:'none',son:'goals',grandma:'none',grandpa:'none'},feed:[{by:'Maya',message:'I am saving for my first car. Any advice?'},{by:'Amira',message:'Our family savings challenge starts this week!'}],gifts:[],requests:[],challenge:'Savings sprint',events:[],consentAt:null,childActivities:[],childProfiles:[{name:'Leo',age:8,guardian:'dad'}]};
let state;try{state=JSON.parse(sessionStorage.getItem('packd_family_demo'))||structuredClone(initial)}catch(e){state=structuredClone(initial)}
state.profileFocus=state.profileFocus||null;state.childActivities=state.childActivities||[];state.childProfiles=state.childProfiles||[{name:'Leo',age:8,guardian:'dad'}];const root=document.getElementById('root');const save=()=>sessionStorage.setItem('packd_family_demo',JSON.stringify(state));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const me=()=>people.find(p=>p.id===state.viewer);const money=n=>'$'+Number(n).toLocaleString('en-US');const btn=(name,fn,secondary=false)=>'<button '+(secondary?'class="secondary" ':'')+'onclick="'+fn+'">'+name+'</button>';const help=(title,body)=>'<details><summary>'+title+' ⓘ</summary><p class="hint">'+body+'</p></details>';const childNav=['home','learn','space','family'];const categoryTabs={connect:[['home','Family home'],['workspace','My workspace'],['family','Our family'],['space','Family space'],['accounts','Accounts & data']],grow:[['portfolio','Portfolio X-ray'],['decisionLab','Decision Lab'],['decisions','What if?'],['risk','Risk & support'],['health','Future plans']],thrive:[['planning','Family life plan'],['tax','Tax guide'],['faq','FAQs']]};
const childTabs=[['home','My home'],['learn','Money adventures'],['space','Family cheers'],['family','My family'],['faq','FAQs']];
const categoryOf=tab=>Object.keys(categoryTabs).find(k=>categoryTabs[k].some(item=>item[0]===tab))||'connect';
function navigate(tab){state.tab=tab;render()}
function openDrivePanel(){const modal=document.createElement('div');modal.className='pact-modal-backdrop';modal.innerHTML='<section class="pact-modal" role="dialog" aria-modal="true"><button type="button" id="driveClose" aria-label="Close">×</button><h2>▲ Connect Google Drive</h2><p>Import selected documents into your financial workspace.</p><p class="pact-drive-status">Not connected — Google OAuth setup required</p><p>This is a demonstration of the connection entry point. Google Drive authorisation and document import are not configured. No Google credentials are collected.</p><button type="button" id="driveDismiss">Got it</button></section>';document.body.appendChild(modal);modal.querySelector('#driveClose').onclick=()=>modal.remove();modal.querySelector('#driveDismiss').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()}}
function driveAction(){return '<button type="button" class="pact-drive-button" onclick="openDrivePanel()"><span class="pact-drive-mark" aria-hidden="true"><svg viewBox="0 0 40 40" width="29" height="29"><path d="M14 4h10l13 23H27z" fill="#ffba00"/><path d="M14 4h10L11 27H1z" fill="#00875a"/><path d="M11 27h26l-5 9H6z" fill="#2684fc"/></svg></span><span><strong>Connect Google Drive</strong><small>Document import · Setup required</small></span><span>↗</span></button>'}
function toggleSideCategory(key){state.sideExpanded=state.sideExpanded===key?'none':key;render()}
function sideCategoryMenu(key,label,active){const open=(state.sideExpanded!==undefined&&state.sideExpanded!==''?state.sideExpanded:active)===key;return '<section class="pact-side-group"><button type="button" class="pact-side-link pact-side-category '+(active===key?'is-active':'')+'" aria-expanded="'+open+'" aria-controls="pact-menu-'+key+'" onclick="toggleSideCategory(\''+key+'\')"><span>'+label+'</span><span class="pact-side-arrow">'+(open?'⌄':'›')+'</span></button><div id="pact-menu-'+key+'" class="pact-side-children '+(open?'is-open':'')+'">'+categoryTabs[key].map(item=>'<button type="button" class="pact-side-link pact-side-sub '+(state.tab===item[0]?'is-active':'')+'" onclick="state.sideExpanded=\''+key+'\';navigate(\''+item[0]+'\')">'+item[1]+'</button>').join('')+'</div></section>'}
function render(){save();if(!state.started)return welcome();const p=me(),kid=p.age<18;if(kid&&!childTabs.some(item=>item[0]===state.tab))state.tab='learn';const category=categoryOf(state.tab);const categories=[['connect','🤝 Connect'],['grow','🌱 Grow'],['thrive','♡ Thrive']];root.innerHTML='<div class="shell pact-app-shell"><header class="top"><div><strong style="font-size:28px">packd<span style="color:#68a47d">.</span></strong><div class="muted">'+esc(state.family)+' · Fictional demo</div></div><div><label for="viewer">Viewing as</label><select id="viewer" onchange="state.viewer=this.value;state.tab=\'home\';state.sideExpanded=\'\';render()">'+people.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+x.icon+' '+x.name+' ('+x.role+')</option>').join('')+'</select></div></header><div class="pact-app-layout"><aside class="pact-sidebar" aria-label="Primary navigation"><div class="pact-sidebar-label">YOUR WORKSPACE</div>'+(kid?childTabs.map(item=>'<button type="button" class="pact-side-link '+(state.tab===item[0]?'is-active':'')+'" onclick="navigate(\''+item[0]+'\')">'+item[1]+'</button>').join(''):'<button type="button" class="pact-side-link '+(state.tab==='home'?'is-active':'')+'" onclick="state.sideExpanded=\'none\';navigate(\'home\')">⌂ <span>Overview</span></button>'+categories.map(item=>sideCategoryMenu(item[0],item[1],category)).join('')+driveAction())+'</aside><div class="pact-main-column"><main>'+view()+'</main><footer class="hint"><a href="/static/trust.html" target="_blank">Trust Center · Privacy · Terms</a> · PACKD interactive concept · Synthetic data only · No real accounts, gifts, transfers or legal risk-sharing arrangements · '+btn('Restart demo','resetDemo()',true)+'</footer></div></div></div>';if(state.tab==='portfolio')queueMicrotask(()=>window.PACT_ANALYTICS?.render());if(state.tab==='decisionLab')queueMicrotask(()=>window.PACT_ANALYTICS?.decision())}
function welcome(){let s=state.step;root.innerHTML='<div class="hero"><div class="packd-pride-art" aria-label="A family pride of lions"><span>🦁</span><span>🦁</span><span>🦁</span><span>🦁</span></div><h1>packd.</h1><p>Your money. Your family. Stronger together. Plan, save and support each other — on your terms.</p>'+ (s===0?'<p>See how your family can make better money decisions together.</p>'+btn('Create my family','state.step=1;render()')+' '+btn('Sign in to demo','state.step=3;render()',true):s===1?'<h2>Let’s start with you</h2><label>Your name</label><input id="newname" placeholder="Your first name" value="'+esc(state.account)+'"><label>Email (optional in this demo)</label><input placeholder="you@example.com" type="email"><p class="hint">No password or verification required. Nothing is sent to a server.</p>'+btn('Continue','state.account=document.getElementById(\'newname\').value||\'Demo user\';state.step=2;render()'):s===2?'<h2>Build your family circle</h2><label>Family name</label><input id="famname" value="'+esc(state.family)+'"><p>We’ve prepared six fictional family members to explore different life stages.</p>'+people.map(p=>'<div>'+p.icon+' '+p.name+' · '+p.role+', '+p.age+'</div>').join('')+'<p>'+btn('Create family','state.family=document.getElementById(\'famname\').value||\'My Family\';state.step=3;render()')+'</p>':'<h2>Choose what you share</h2><p>You can be part of the family without sharing your finances. Every person controls their own information.</p><label>Your starting preference</label><select id="privacy"><option value="none">Keep everything private</option><option value="goals">Share selected goals only</option><option value="summary">Share a summary</option></select><p>'+'<div class="pact-consents"><label class="pact-consent-row"><input type="checkbox" id="agreeTerms"><span>I accept the <a href="/static/trust.html" target="_blank" rel="noopener">Privacy Policy and Demo Terms</a>.</span></label><label class="pact-consent-row"><input type="checkbox" id="agreeConfidential"><span>I will not submit real or confidential financial information.</span></label><label class="pact-consent-row"><input type="checkbox" id="agreeAi"><span>Allow Nicrron AI to process demo questions (optional).</span></label></div><p>'+btn('Enter family home','enterWithConsent()')+'</p>')+'</div>'}
function enterWithConsent(){if(!document.getElementById('agreeTerms').checked||!document.getElementById('agreeConfidential').checked){alert('Please review and accept the demo terms and confidentiality notice.');return}state.privacy.dad=document.getElementById('privacy').value;state.aiConsent=document.getElementById('agreeAi').checked;state.consentAt=new Date().toISOString();state.started=true;render()}
function view(){switch(state.tab){case'home':return me().age<18?childHome():home();case'workspace':return workspace();case'learn':return childLearn();case'space':return me().age<18?childSpace():space();case'family':return me().age<18?childFamily():family();case'portfolio':return portfolio();case'decisionLab':return '<div id="packd-decision-lab"></div>';case'decisions':return decisions();case'risk':return risk();case'health':return health();case'planning':return planningHub();case'tax':return tax();case'accounts':return accounts();case'faq':return faq();default:return faq()}}
const planningPillars=[
['Emergency fund','🐷','Build a safety buffer for unexpected expenses and financial resilience.','grow','health','Savings goal and emergency reserve proxy'],
['Health insurance','💚','Plan for medical costs and protect family health.','grow','risk','Coverage details not connected'],
['Disability protection','♿','Consider income replacement and financial stability after disability.','grow','decisions','Income and policy terms not connected'],
['Education funding','🎓','Plan education savings, financial aid and future study costs.','grow','health','Life-event capital requirements'],
['Investments & wealth growth','📈','Explore diversification, family holdings and long-term growth.','grow','portfolio','Synthetic portfolio benchmark'],
['Mortgage & housing','🏠','Consider housing costs, mortgages and home equity in future goals.','grow','decisions','Mortgage and housing data not connected'],
['Life insurance','🛡️','Explore income protection for loved ones and potential cover gaps.','grow','decisions','User-entered hypothetical protection gap'],
['Retirement planning','🪑','Consider retirement income, time horizons and sustainable withdrawals.','grow','health','Synthetic Monte Carlo benchmark'],
['Longevity & long-term care','🧓','Prepare for longer lives and potential long-term care expenses.','grow','decisions','User-entered care cost assumptions'],
['Legacy & estate planning','🌳','Consider inheritance, care for loved ones and estate planning.','thrive','tax','Educational guidance only']
];
function planningTeaser(){return '<section class="pact-plan-teaser"><div class="packd-plan-copy"><span class="pact-eyebrow">WHOLE-FAMILY PLANNING</span><h2>One family. Ten dimensions of financial wellbeing.</h2><p>From emergency savings to long-term care and legacy, explore a life-stage plan that connects your family goals.</p></div>'+btn('Explore the family plan',"navigate('planning')")+'<div class="packd-pride-illustration" role="img" aria-label="A family of lions: lion, lioness and three cubs in a golden savannah"></div></section>'}
function planningHub(){const p=me();const focus=Number(state.planningFocus||0);const item=planningPillars[focus];return '<h1>Whole-family financial wellbeing</h1><p>Explore ten connected planning priorities, tailored to different life stages. Inspired by the family financial planning framework.</p><section class="pact-plan-foundation"><span class="pact-eyebrow">PLANNING FOUNDATION</span><div class="pact-foundation-grid">'+[['🎯','Family goals & priorities'],['⚖️','Risk tolerance & capacity'],['⌛','Time horizon & life stages'],['🪙','Cash flow & net worth'],['📜','Tax & regulatory considerations']].map(x=>'<div><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('')+'</div></section><section class="pact-plan-grid"><div class="pact-plan-center"><span>🦁🦁🦁</span><h2>'+esc(state.family)+'</h2><p>Security · Growth · Education · Retirement · Legacy</p><small>Only consented data can contribute to family analysis.</small></div><div class="pact-pillar-grid">'+planningPillars.map((x,i)=>'<button type="button" class="pact-pillar '+(focus===i?'selected':'')+'" onclick="state.planningFocus='+i+';render()"><span class="pact-pillar-icon">'+x[1]+'</span><span><small>'+String(i+1).padStart(2,'0')+'</small><strong>'+x[0]+'</strong></span><span aria-hidden="true">›</span></button>').join('')+'</div></section><section class="card pact-pillar-detail"><span class="pact-eyebrow">PLANNING PRIORITY '+String(focus+1).padStart(2,'0')+' / 10</span><h2>'+item[1]+' '+item[0]+'</h2><p>'+item[2]+'</p><div class="pact-source-note"><strong>Available evidence:</strong> '+item[5]+'. <strong>Status:</strong> educational or synthetic demo, not a verified personal assessment.</div><p>'+btn('Explore related PACKD tools',"navigate('"+item[4]+"')")+'</p></section><section class="card"><h2>Expected outcomes</h2><div class="pact-outcome-grid">'+['🛡️ Family financial security','📈 Long-term wealth growth','🎓 Education opportunities','🌅 Confident retirement','💚 Health and quality of life','🌳 A lasting family legacy'].map(x=>'<span>'+x+'</span>').join('')+'</div><p class="hint">These are planning objectives, not guaranteed outcomes. The current demo does not verify insurance coverage, debt, tax obligations or estate documents.</p></section>'}
function teamGraphic(){return '<section class="team-journey"><h2>🌱 Better together</h2><p>Explore PACT through three connected experiences. Select a stage to see its tools.</p><div class="team-track">'+[['connect','🤝','Connect','Family, sharing and accounts'],['grow','🌱','Grow','Portfolios, risk and simulation'],['thrive','🏡','Thrive','Guidance, tax and FAQs']].map((item,i)=>'<button type="button" class="team-stage pact-stage-button" onclick="navigate(\''+categoryTabs[item[0]][0][0]+'\')"><span class="figure">'+item[1]+'</span><strong>'+item[2]+'</strong><small>'+item[3]+'</small></button>'+(i<2?'<span class="team-arrow" aria-hidden="true">➜</span>':'')).join('')+'</div></section>'}
function home(){let p=me(),kid=p.age<18,young=p.age<26,senior=p.age>75;return '<h1>Hi '+p.name+' 👋</h1><p class="muted">'+(kid?'Let’s grow your savings jar!':young?'Your money, your future. One step at a time.':senior?'Your important money reminders and family updates, all in one place.':'Here’s what matters to your family this week.')+'</p>'+familyHealth()+planningTeaser()+avatarBoard()+teamGraphic()+'<div class="grid"><section class="card"><span class="pill">Your savings goal</span><div class="metric">'+Math.round(p.saved/p.goal*100)+'%</div><div class="progress"><i style="width:'+Math.min(100,p.saved/p.goal*100)+'%"></i></div><p class="hint">'+money(p.saved)+' saved towards '+money(p.goal)+' · Your own synthetic goal</p></section><section class="card"><span class="pill">Family challenge</span><h3>Save together this month</h3><p>Celebrate progress, not who has the most money.</p>'+btn('See challenge','state.tab=\'space\';render()')+'</section><section class="card"><span class="pill">Upcoming</span><h3>Insurance renewal</h3><p>Grandma · Due in 12 days</p>'+btn('View family reminders','state.tab=\'family\';render()',true)+'</section></div><div class="two"><section class="card"><h2>Things worth talking about</h2><div class="row">🔒 Maya controls what she shares</div><div class="row">🛟 Could your family cover an unexpected expense?</div><div class="row">🎁 Send encouragement or a gift</div>'+btn('Go to Family Space','state.tab=\'space\';render()')+'</section><section class="card"><h2>Your financial picture</h2><p>Only information you have permission to see is shown.</p>'+(kid?'<p class="hint">Your savings jar is ready. Adult finances are not visible in this view.</p>':young?'<p>Start with your own goals. Household financial details are not shown.</p>':'<p>Explore the shared family finances and areas that may need attention.</p>'+help('What does family wealth mean?','The value of assets minus debts. This illustration includes home equity. Only data authorised for sharing should be included.'))+btn('Explore money picture','state.tab=\'portfolio\';render()',true)+'</section></div>'}
function space(){let visible=people.filter(p=>p.age>=18||p.id==='son');return '<h1>Family Space 🎉</h1><p>Celebrate progress, exchange ideas and help each other. Sharing balances is always optional.</p><div class="two"><section class="card"><h2>🏆 Savings sprint</h2><p class="hint">Ranked by % of personal goal reached — never by net worth. Private members can opt out.</p>'+visible.filter(p=>state.privacy[p.id]!=='none').sort((a,b)=>b.saved/b.goal-a.saved/a.goal).map((p,i)=>'<div class="row"><span>'+(i+1)+'. '+p.icon+' '+p.name+'</span><strong>'+Math.round(p.saved/p.goal*100)+'%</strong></div>').join('')+btn('Celebrate a member','giftForm()')+'</section><section class="card"><h2>🎁 Send a gift</h2><p class="hint">Demo-only gift pledges. No payment or transfer takes place.</p><label>To</label><select id="giftTo">'+people.filter(p=>p.id!==state.viewer).map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Gift type</label><select id="giftType"><option>Encouragement 🎉</option><option>Birthday gift pledge 🎁</option><option>Savings contribution pledge 💚</option></select><label>Message</label><input id="giftMessage" placeholder="Proud of your progress!">'+btn('Send demo gift','sendGift()')+'</section></div><div class="two"><section class="card"><h2>💬 Family conversation</h2>'+state.feed.slice().reverse().map(f=>'<div class="feed"><strong>'+esc(f.by)+'</strong><p>'+esc(f.message)+'</p></div>').join('')+'<label>Share an update</label><textarea id="post" rows="2" placeholder="Ask a question or celebrate a milestone"></textarea>'+btn('Post to family','postFeed()')+'</section><section class="card"><h2>🤝 Ask for support</h2><p>Ask for advice, time or a voluntary gift pledge.</p><label>What would help?</label><select id="requestType"><option>Advice</option><option>Help with an unexpected expense</option><option>Saving for a goal</option><option>Practical help</option></select><label>Tell your family</label><textarea id="requestText" rows="2" placeholder="What support are you looking for?"></textarea>'+btn('Share request','sendRequest()')+state.requests.map(x=>'<div class="feed">'+esc(x)+'</div>').join('')+'</section></div>'}
function lionAvatar(p){const female=['mum','daughter','grandma'].includes(p.id);const cub=['son','daughter'].includes(p.id);const elder=['grandma','grandpa'].includes(p.id);return '<span class="packd-avatar-art '+(female?'lioness':'lion')+' '+(cub?'cub':'')+' '+(elder?'elder':'')+'" role="img" aria-label="'+(female?'Lioness':'Lion')+' avatar for '+esc(p.name)+'"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="'+(female?'#eee0c9':'#e8d4a9')+'"/>'+(female?'<path d="M22 42Q18 11 36 25Q50 17 64 25Q83 10 78 42L74 70Q50 91 26 70Z" fill="#bf935d"/>':'<path d="M15 50Q6 25 30 16Q50 2 70 16Q94 25 85 52Q95 77 68 85Q50 97 32 85Q5 77 15 50Z" fill="#98673f"/>')+'<path d="M28 39Q20 16 38 27L44 35M72 39Q80 16 62 27L56 35" fill="#bd915f" stroke="#98673f" stroke-width="2"/><ellipse cx="50" cy="54" rx="'+(cub?24:27)+'" ry="'+(cub?27:30)+'" fill="#e6bc7f"/><path d="M35 49q7-5 13 0m5 0q7-5 13 0" stroke="#463b32" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M42 63q8-7 16 0l-8 7Z" fill="#6c4c3c"/><path d="M50 70q-7 8-15 0m15 0q7 8 15 0" fill="none" stroke="#6c4c3c" stroke-width="2.4" stroke-linecap="round"/>'+(elder?'<path d="M30 68q-4 7 0 12m40-12q4 7 0 12" stroke="#d8c3a0" stroke-width="2" fill="none"/>':'')+'</svg></span>'}
function avatarBoard(){return '<section class="card pact-family-board"><h2>🦁 Meet your pride</h2><p class="hint">Select a member to view their shared profile. Maya has chosen to keep her finances private in this demo.</p><div class="pact-avatar-grid">'+people.map(p=>'<button type="button" class="pact-avatar-tile" onclick="openProfile(\''+p.id+'\')"><span class="pact-avatar-face">'+p.icon+'</span><strong>'+esc(p.name)+'</strong><small>'+esc(p.role)+'</small><span class="pact-privacy-chip">'+(p.id===state.viewer?'Your profile':state.privacy[p.id]==='none'?'🔒 Private':state.privacy[p.id]==='goals'?'🎯 Goals shared':'📊 Summary shared')+'</span></button>').join('')+'</div></section>'}
function openProfile(id){state.profileFocus=id;state.tab='family';render();const el=document.getElementById('pact-profile-detail');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function profileDetail(){const p=people.find(x=>x.id===state.profileFocus);if(!p)return '';const own=p.id===state.viewer;const share=state.privacy[p.id]||'none';return '<section class="card" id="pact-profile-detail"><div class="person"><span class="pact-avatar-face">'+p.icon+'</span><div><h2>'+esc(p.name)+'’s profile</h2><p>'+esc(p.role)+'</p></div></div>'+(own?'<p>This is your own workspace. Your private data stays visible to you.</p>'+btn('Manage my sharing',"navigate('workspace')"):share==='none'?'<div class="pact-restricted"><h3>🔒 '+esc(p.name)+' has restricted this view</h3><p>'+esc(p.name)+' has chosen not to share financial information with other family members. Their balances, holdings, goals and financial activity are hidden.</p></div>':share==='goals'?'<div class="pact-restricted"><h3>🎯 Goals-only access</h3><p>'+esc(p.name)+' shares selected goals, but account balances, investments and private activity remain hidden.</p></div>':'<div><h3>Shared summary</h3><p>'+esc(p.name)+' has opted to share a summary of their savings goal.</p><div class="metric">'+Math.round(p.saved/p.goal*100)+'% of goal</div><p class="hint">No account credentials or transaction history are shown.</p></div>')+'</section>'}
function workspace(){const p=me();const share=state.privacy[p.id]||'none';return '<h1>🔐 My workspace</h1><p>Your own private space. Decide what other family members can see about you.</p><section class="card"><div class="person"><span class="pact-avatar-face">'+p.icon+'</span><div><h2>'+esc(p.name)+'</h2><p>'+esc(p.role)+' · Personal workspace</p></div></div><h3>Family sharing permissions</h3><label for="workspaceShare">Who can see my financial information?</label><select id="workspaceShare"><option value="none" '+(share==='none'?'selected':'')+'>Private — show nothing financial</option><option value="goals" '+(share==='goals'?'selected':'')+'>Goals only — hide balances and holdings</option><option value="summary" '+(share==='summary'?'selected':'')+'>Share a summary — show goal progress</option></select><p>'+btn('Save sharing preference','saveWorkspaceShare()')+'</p><p class="hint">Your choice is reflected immediately when another demo family member selects your avatar.</p></section><section class="card"><h2>What others can see</h2>'+(share==='none'?'<p>🔒 Your financial profile is restricted to other family members.</p>':share==='goals'?'<p>🎯 Others can see selected goals, not your balances or investments.</p>':'<p>📊 Others can see your shared goal-progress summary.</p>')+'</section><p class="hint">Demo limitation: family-member switching and permissions are simulated in one browser. This is not secure identity verification or server-side access control.</p>'}
function saveWorkspaceShare(){const sel=document.getElementById('workspaceShare');if(!sel)return;state.privacy[state.viewer]=sel.value;render()}
function family(){return guardianPanel()+'<h1>Our family circle</h1><p>Choose an avatar to see what that person has chosen to share.</p>'+avatarBoard()+profileDetail()+'<section class="card"><h2>Your sharing preferences</h2><p>Control your own visibility from <strong>Connect → My workspace</strong>.</p>'+btn('Open my workspace',"navigate('workspace')")+'</section><section class="card"><h2>Reminders</h2><div class="row">Grandma · Insurance renewal · 12 days</div><div class="row">Dad · Review emergency savings · This month</div><div class="row">Family · Check your shared goals · Next week</div></section><section class="card"><h2>Extended family circles</h2><p>Coming later: invite cousins and other households to a separate circle, with separate permissions and support requests.</p></section>'}
function historicalPrices(){return '<section class="card"><h2>Historical market prices</h2><p class="hint">Source: Yahoo Finance historical chart data. Market prices are not family holdings, and do not include dividends or FX conversion.</p><div class="row"><label for="marketTicker">Market ticker</label><select id="marketTicker"><option>SPY</option><option>VWRP.L</option><option>VUAG.L</option><option>AAPL</option><option>MSFT</option><option>TSLA</option></select><label for="marketRange">History</label><select id="marketRange"><option value="1y">1 year</option><option value="5y">5 years</option><option value="10y">10 years</option></select><button type="button" onclick="loadHistoricalPrices()">Load history</button></div><div id="marketHistoryResult" class="hint" aria-live="polite">Choose a ticker to load source-attributed historical prices.</div></section>'}
async function loadHistoricalPrices(){const el=document.getElementById('marketHistoryResult');if(!el)return;const ticker=document.getElementById('marketTicker').value,range=document.getElementById('marketRange').value;el.textContent='Loading historical market prices…';try{const response=await fetch('/api/public/market-history?symbol='+encodeURIComponent(ticker)+'&range='+encodeURIComponent(range)+'&interval=1mo');if(!response.ok)throw Error('Historical data provider unavailable ('+response.status+').');const d=await response.json(),v=d.observations;if(!v?.length)throw Error('No observations returned.');const min=Math.min(...v.map(x=>x.close)),max=Math.max(...v.map(x=>x.close)),w=620,h=140,pts=v.map((x,i)=>((i/(v.length-1||1))*w).toFixed(1)+','+(h-((x.close-min)/(max-min||1))*h).toFixed(1)).join(' ');el.innerHTML='<div class="pact-source-note"><strong>'+esc(d.symbol)+'</strong> · '+esc(d.currency||'Currency not supplied')+' · '+v.length+' monthly observations · '+esc(v[0].date)+' to '+esc(d.as_of)+'</div><svg viewBox="0 0 640 160" role="img" aria-label="Historical price chart for '+esc(d.symbol)+'" style="width:100%;max-width:700px"><polyline points="'+pts+'" transform="translate(10 10)" fill="none" stroke="#626B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><p class="hint">First close: '+v[0].close.toFixed(2)+' · Last close: '+v[v.length-1].close.toFixed(2)+'. Source: <a href="'+esc(d.source_url)+'" target="_blank" rel="noopener">Yahoo Finance</a>. Historical, not live account data; no dividends, FX or fees.</p>'}catch(e){el.textContent=e.message+' No simulated price data has been substituted.'}}
function portfolio(){return '<h1>Portfolio X-ray</h1><div id="pact-analytics"></div>'+historicalPrices()}
function decisions(){return '<h1>What if…?</h1><p>Ask your own question about a major family event. The demo calculates transparent illustrative impacts for supported scenarios.</p><section class="card"><label for="scenarioQuestion">Your what-if question</label><textarea id="scenarioQuestion" rows="3" placeholder="What if Dad loses his job for six months? What if markets fall 20%? What if Grandma needs long-term care?"></textarea><p class="hint">Examples to try (click to fill, then edit):</p><div class="pact-scenario-chips">'+['What if Dad loses his job for 6 months?','What if markets fall by 20%?','What if we need $2,000 a month for long-term care?','What if our family needs $150,000 of life insurance?'].map(q=>'<button type="button" onclick="document.getElementById(\'scenarioQuestion\').value=\''+q.replaceAll("'","\\'")+'\'">'+q+'</button>').join('')+'</div><label for="scenarioAmount">Optional cash impact ($) — for job loss, care or other expenses</label><input id="scenarioAmount" type="number" min="0" max="10000000" value="3000"><p>'+btn('Explore my question','scenarioResult()')+'</p><div id="scenarioResult" class="feed hidden" aria-live="polite"></div></section><section class="card"><h2>🛡️ Life and family protection</h2><p>Explore the effect of losing a household income, a death in the family or a long-term care requirement. Insurance can provide protection, but actual coverage depends on the policy, exclusions, eligibility and claim conditions.</p><label for="coverAmount">Illustrative life insurance benefit ($)</label><input id="coverAmount" type="number" min="0" max="10000000" value="150000"><label for="protectionNeed">Illustrative family protection need ($)</label><input id="protectionNeed" type="number" min="0" max="10000000" value="200000"><p>'+btn('Estimate protection gap','calculateProtectionGap()')+'</p><div id="protectionResult" class="feed" aria-live="polite">Demo calculation only; no insurance policy is connected or verified.</div></section>'}
function calculateProtectionGap(){const cover=Number(document.getElementById('coverAmount')?.value),need=Number(document.getElementById('protectionNeed')?.value),el=document.getElementById('protectionResult');if(!el)return;if(!Number.isFinite(cover)||!Number.isFinite(need)||cover<0||need<0){el.textContent='Enter valid nonnegative values.';return}el.textContent='Illustrative gap: '+money(Math.max(0,need-cover))+'. Formula: max(0, family protection need − assumed insurance benefit). Coverage and need are entered demo assumptions, not verified policies or a recommendation.'}
function risk(){return '<h1>Risk & family support 🛟</h1><p>Risk means things that could make money plans harder — such as losing income, surprise bills or falling investments.</p><div class="two"><div class="card"><h2>How comfortable are you with risk?</h2><p>Choose what feels closest to you.</p><select id="appetite"><option>I prefer certainty, even if growth is slower</option><option>I can accept some ups and downs</option><option>I can tolerate bigger changes for possible long-term growth</option></select>'+btn('Save my preference','alert(\'Saved for this demonstration. This is not an investment suitability assessment.\')')+'<p class="hint">Your preference is not a recommendation to buy or sell investments.</p></div><div class="card"><h2>Share support, not liabilities</h2><p>Offer advice, a voluntary emergency-support pledge, or help planning a financial buffer.</p><label>Support I can offer</label><select id="riskSupport"><option>Advice and encouragement</option><option>Help review an emergency plan</option><option>Voluntary support pledge</option></select>'+btn('Share with family','state.feed.push({by:me().name,message:\'I can offer: \'+document.getElementById(\'riskSupport\').value});state.tab=\'space\';render()')+'<p class="hint">No binding guarantees, debt transfers or investment risk pooling.</p></div></div><div class="card"><h2>Things to keep an eye on</h2><div class="row">🏠 Relying on one main household income</div><div class="row">💧 Having enough emergency cash</div><div class="row">📉 Investments falling when money is needed</div>'+help('See how risk can be calculated','The research engine uses covariance, portfolio weights, constraints and Monte Carlo projections. Those calculations must be tied to permissioned source data before production use.')+'</div>'}
function healthScore(p){const progress=Math.min(1,p.saved/Math.max(1,p.goal));const gap=Math.max(0,p.goal-p.saved);const goalPoints=Math.round(progress*40);const reservePoints=Math.round(Math.min(1,p.saved/Math.max(1,p.goal*.5))*30);const consistencyPoints=15;return {score:goalPoints+reservePoints+consistencyPoints,goalPoints,reservePoints,consistencyPoints,gap,progress,source:'Synthetic family goal records in static/family-demo.html',limited:true}}
function healthScoreCard(p){const x=healthScore(p),visible=p.id===state.viewer||state.privacy[p.id]==='summary';if(!visible)return '<section class="card"><h3>'+esc(p.name)+'</h3><p>🔒 '+esc(p.name)+' has restricted their financial health view.</p><p class="hint">No score or underlying values are disclosed.</p></section>';return '<button type="button" class="card pact-score-card" onclick="openHealthDetail(\''+p.id+'\')"><span class="pill">'+esc(p.name)+' · Illustrative score</span><div class="metric">'+x.score+'<small>/100</small></div><p>See risk breakdown and actions →</p><p class="hint">Partial: savings-goal inputs only</p></button>'}
function openHealthDetail(id){const p=people.find(x=>x.id===id);if(!p)return;if(id!==state.viewer&&state.privacy[id]!=='summary')return;state.healthFocus=id;state.tab='health';render();document.getElementById('pact-health-detail')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function healthDetail(){const p=people.find(x=>x.id===state.healthFocus);if(!p||p.id!==state.viewer&&state.privacy[p.id]!=='summary')return '';const x=healthScore(p);const rows=[['Savings goal progress',40,x.goalPoints,'Save towards the remaining '+money(x.gap)+' of the synthetic goal.'],['Savings cushion proxy',30,x.reservePoints,'Build an emergency reserve; a real resilience score would require expenses and cash balances.'],['Unmeasured factors',30,x.consistencyPoints,'Connect or enter verified income, debt, expenses, liquidity and protection data to support a fuller assessment.']];return '<section class="card" id="pact-health-detail"><h2>'+esc(p.name)+' · How the score is calculated</h2><p><strong>'+x.score+'/100</strong> · Illustrative, partial savings-readiness indicator, not a validated financial-health rating.</p>'+rows.map(r=>'<div class="row"><div><strong>'+r[0]+'</strong><p class="hint">'+r[3]+'</p></div><strong>'+r[2]+' / '+r[1]+'</strong></div>').join('')+'<p class="hint">Formula: goal progress (up to 40) + savings cushion proxy (up to 30) + fixed 15-point placeholder for unmeasured factors (out of 30). Source: '+x.source+'. The fixed placeholder is not evidence of actual financial health.</p></section>'}
function familyHealth(){const eligible=people.filter(p=>p.id===state.viewer||state.privacy[p.id]==='summary');const excluded=people.length-eligible.length;const score=Math.round(eligible.reduce((n,p)=>n+healthScore(p).score,0)/Math.max(1,eligible.length));return '<section class="card"><h2>🏡 Family financial health</h2><button type="button" class="pact-score-card" onclick="document.getElementById(\'family-health-explain\').open=true;document.getElementById(\'family-health-explain\').scrollIntoView({block:\'nearest\',behavior:\'smooth\'})"><span class="metric">'+score+'/100</span><span>Explore family risk breakdown →</span></button><p class="hint">Partial score based on '+eligible.length+' consented or own profiles. '+excluded+' other profile(s) excluded. Equal-weight average of illustrative individual indicators; not a complete family financial health assessment.</p><details id="family-health-explain"><summary>Score method and ways to improve</summary><p>Each included profile contributes equally. The indicator uses synthetic savings-goal progress and a savings cushion proxy, plus a fixed placeholder for unmeasured risks. It does not assess debt, income stability, expenses, insurance, portfolio risk or retirement readiness.</p><p>Improve it by strengthening savings goals and emergency reserves. A complete score requires verified, consented financial data and validated risk weights.</p></details></section>'}
function healthDashboard(){return '<h1>Financial health</h1><p>Click any available score to see its components, sources and suggested actions.</p>'+familyHealth()+'<h2>Individual scores</h2><div class="grid">'+people.map(healthScoreCard).join('')+'</div>'+healthDetail()}
function health(){return healthDashboard()+'<section class="card"><h2>🔬 Run a reproducible portfolio simulation</h2><p>Run the separate synthetic research benchmark with 1,000 correlated market paths. The results use a fixed random seed and can be traced to engine.py.</p><label>Years</label><input type="number" id="simYears" min="1" max="30" value="10"><label><input type="checkbox" id="simCrash"> Include a first-year market shock</label>'+btn('Run Monte Carlo','runPactSimulation()')+'<div id="simOutput" class="feed"></div></section>'+eventTimeline()+'<h1>Your future plans</h1><div class="card"><h2>Could your savings last?</h2><p>Financial projections explore a range of possible futures, not one guaranteed answer.</p><p>Our research engine uses Monte Carlo simulation to explore thousands of possible market paths. The full technical engine remains in the existing PACT research dashboard.</p>'+help('What is Monte Carlo?','A method that tests many possible future paths using assumptions about returns and uncertainty. Results depend on the assumptions and are not predictions.')+'</div>'}
function tax(){return '<h1>Tax guide</h1><p class="hint">Illustrative U.S. educational examples · Synthetic figures only</p><div class="card"><h2>Explore how account types affect tax</h2><p>In the U.S., taxable brokerage, traditional retirement and Roth retirement accounts have different tax treatment. Contributions, withdrawals and eligibility depend on account type and personal circumstances.</p><p class="warn"><strong>Demo only:</strong> The calculator below uses a hypothetical 20% rate on the full example gain, without exemptions or allowances. It is not a current U.S. tax calculation, personalised tax estimate or financial advice.</p><label for="taxInvestment">Illustrative investment amount ($)</label><input id="taxInvestment" type="number" min="0" max="10000000" value="10000"><label for="taxGain">Illustrative investment gain (%)</label><input id="taxGain" type="number" min="-100" max="1000" value="10"><p>'+btn('Compare demo account types','calculateDemoTax()')+'</p><div id="taxDemoOutput" class="feed" aria-live="polite">Enter example values and select Compare demo account types.</div></div><div class="grid"><section class="card"><h3>🛡️ Stocks & Shares ISA</h3><p>Generally tax-sheltered for eligible UK investment gains and income, subject to account eligibility and applicable rules.</p></section><section class="card"><h3>📈 General investment account</h3><p>Investment income and realised gains may be taxable. Applicable allowances, losses and rates depend on individual circumstances.</p></section><section class="card"><h3>🌅 Pension</h3><p>Tax treatment depends on pension type, contribution relief, limits and how benefits are withdrawn.</p></section></div><section class="card"><h2>Questions to explore</h2><p>Which accounts hold each family member’s investments? Which holdings are inside an ISA or pension? Could a future sale create a taxable gain? These are questions to investigate, not personalised recommendations.</p><p class="hint">Tax treatment is individual. Family aggregation does not combine personal tax allowances. No live tax data or verified tax rules are used in this prototype.</p></section>'}
function calculateDemoTax(){const principal=Number(document.getElementById('taxInvestment')?.value),pct=Number(document.getElementById('taxGain')?.value),out=document.getElementById('taxDemoOutput');if(!out)return;if(!Number.isFinite(principal)||principal<0||principal>10000000||!Number.isFinite(pct)||pct< -100||pct>1000){out.textContent='Enter an amount from $0 to $10 million and a gain between -100% and 1,000%.';return}const gain=principal*pct/100,illustrativeCharge=Math.max(0,gain)*.2;out.innerHTML='<strong>Hypothetical comparison</strong><div class="row"><span>Example investment gain</span><strong>'+money(gain)+'</strong></div><div class="row"><span>Illustrative ISA charge on eligible gain</span><strong>'+money(0)+'</strong></div><div class="row"><span>Illustrative taxable-account charge (assumed flat 20%)</span><strong>'+money(illustrativeCharge)+'</strong></div><p class="hint">The 20% is a fictional modelling assumption, not a statement of the rate that applies to you. The calculation ignores exemptions, allowances, losses, realisation timing and other tax rules. Source: entered demo values; formula = max(0, amount × gain %) × 20%. Not tax advice.</p>'}
function accounts(){return '<h1>Accounts & data</h1>'+driveAction()+'<p>Bring your finances together, while deciding what stays private.</p><div class="card"><h2>Connect your bank with Plaid</h2><p>Secure, consent-based bank connections are planned.</p>'+btn('Connect with Plaid','window.PACT_PLAID()')+'<p class="hint">Demo placeholder. No live account connection.</p></div><div class="grid">'+['Bank account','Investment platform (e.g. eToro)','Pension','Manual entry'].map(x=>'<div class="card"><h3>'+x+'</h3><p class="hint">Synthetic demo connector</p>'+btn('Preview connection','alert(\'Demo only: no real account is linked and no credentials are collected.\')',true)+'</div>').join('')+'</div><p class="warn">Never enter real banking passwords, account numbers or personal financial information in this prototype.</p>'}
function faq(){const questions=[['What is PACT?','PACT helps a family understand shared and individual finances while respecting each member’s privacy.'],['How does top-down and bottom-up analysis work?','Top-down analysis starts with family allocation and risk. Bottom-up analysis traces contributions from each member, account and asset class. Open Grow → Portfolio X-ray to inspect the traceable synthetic benchmark.'],['Is the portfolio real?','No. The hackathon benchmark is synthetic, and the sample ETF and stock positions are illustrative. Calculations are derived from explicit benchmark inputs, not live bank balances.'],['How do I connect an account?','Go to Connect → Accounts & data. Plaid is not yet connected for live authorization. The demo will not collect bank passwords.'],['How do simulations work?','Go to Grow → Future plans and run the reproducible Monte Carlo benchmark. Personal life events are recorded separately and are not yet fed into that engine.'],['Where can I ask an AI question?','Enable Aunt Mabel using the small control in the bottom-right corner. Consent is required before a question is sent to Nicrron.'],['Can a child see my portfolio?','The child interface excludes adult investment screens. This synthetic demo is not secure parental authentication; production controls require server-side enforcement.'],['What is PRISM?','When configured, PRISM receives redacted metadata about Nicrron AI calls for traceability. A trace does not independently verify the answer.']];return '<h1>Frequently asked questions</h1><p>Quick answers to common questions. For personalised portfolio questions, use Aunt Mabel.</p><div class="card">'+questions.map(([q,a])=>'<details class="pact-faq"><summary>'+q+'</summary><p>'+a+'</p></details>').join('')+'</div><p><a href="/static/trust.html" target="_blank" rel="noopener">Read the Trust Center and Privacy Policy</a></p>'}
function answer(){let q=document.getElementById('question').value.toLowerCase();let a=q.includes('risk')?'Risk is the possibility that your money plans do not go as expected. Think about emergency cash, income stability and investment ups and downs.':q.includes('tax')?'Tax depends on where you live and your personal circumstances. PACT can help you identify questions to check, but this demo does not provide tax advice.':q.includes('save')?'Start with a goal, set aside a manageable amount regularly and review your progress. You can join a family challenge without revealing balances.':'PACT helps families set goals, share only what they choose and discuss financial decisions. Ask about savings, risk or tax.';let el=document.getElementById('answer');el.classList.remove('hidden');el.textContent=a}
function scenarioResult(){const q=document.getElementById('scenarioQuestion').value.trim(),amount=Number(document.getElementById('scenarioAmount').value),el=document.getElementById('scenarioResult');el.classList.remove('hidden');if(!q){el.textContent='Enter your own what-if question first.';return}if(!Number.isFinite(amount)||amount<0||amount>10000000){el.textContent='Enter a valid illustrative amount.';return}const lower=q.toLowerCase();const pct=lower.match(/(\d+(?:\.\d+)?)\s*%/);const month=lower.match(/(\d+)\s*months?/);const years=lower.match(/(\d+)\s*years?/);let type='',result='',source='User-entered assumptions';if(/market|stocks|shares|crash|portfolio|investments/.test(lower)&&/fall|drop|crash|declin|down|lose/.test(lower)){type='Market decline';const fall=pct?Math.min(100,Number(pct[1])):20;result='For a hypothetical '+fall+'% decline, every $10,000 of exposed assets would lose '+money(10000*fall/100)+'. Actual family losses depend on consented holdings and asset exposures, which are not connected to this simple example.';source='Entered market-shock percentage × hypothetical $10,000 exposure'}else if(/job|unemploy|redundan|income|salary/.test(lower)){type='Income disruption';const duration=month?Number(month[1]):years?Number(years[1])*12:6;result='Assuming '+money(amount)+' lost income per month over '+duration+' months, the illustrative shortfall is '+money(amount*duration)+'. This does not account for replacement income, tax, benefits or available cash reserves.';source='Entered monthly loss × duration'}else if(/care|nursing|elder|medical|health/.test(lower)){type='Long-term care';const duration=month?Number(month[1]):years?Number(years[1])*12:12;result='At '+money(amount)+' per month for '+duration+' months, the illustrative care requirement is '+money(amount*duration)+'. This excludes inflation, public support, insurance and care eligibility.';source='Entered monthly care cost × duration'}else if(/life insurance|death|die|pass away|protection|survivor/.test(lower)){type='Family protection';result='Use the Life and family protection panel below to enter an illustrative protection need and insurance benefit. The gap is calculated as max(0, need − benefit). No policy coverage has been verified.';source='Entered protection assumptions'}else if(/retire|retirement|pension/.test(lower)){type='Retirement planning';result='Retirement requires a time horizon, spending needs, expected pension income and consented assets. Use Grow → Future plans for the existing Monte Carlo benchmark. This free-text example cannot yet calculate a personalised retirement outcome.';source='No calculation performed'}else{type='Custom question';result='Your question is recorded for this demonstration, but it cannot be safely translated into a verified numerical simulation yet. Please provide the relevant financial assumptions, or ask Aunt Mabel for an educational explanation. No invented forecast has been generated.';source='No calculation performed'}el.innerHTML='<strong>'+esc(type)+'</strong><p>'+esc(result)+'</p><p class="hint">Question: '+esc(q)+'</p><p class="hint">Evidence: '+esc(source)+'. Synthetic illustrative calculation only; not personalised advice. Private member data is not used.</p>'}
function postFeed(){let v=document.getElementById('post').value.trim();if(v){state.feed.push({by:me().name,message:v});render()}}
function sendGift(){let p=people.find(p=>p.id===document.getElementById('giftTo').value);state.feed.push({by:me().name,message:'Sent '+p.name+' a demo '+document.getElementById('giftType').value.toLowerCase()+': '+document.getElementById('giftMessage').value});render()}
function sendRequest(){let v=document.getElementById('requestText').value.trim();if(v){state.requests.push(me().name+': '+document.getElementById('requestType').value+' — '+v);state.feed.push({by:me().name,message:'Support request: '+v});render()}}
function giftForm(){document.getElementById('giftTo').focus()}

async function runPactSimulation(){const el=document.getElementById('simOutput');const years=Number(document.getElementById('simYears').value),crash=document.getElementById('simCrash').checked;el.textContent='Running…';try{const r=await fetch('/api/public/simulation?years='+years+'&crash='+crash);const d=await r.json();if(!r.ok)throw Error(d.detail||'Unavailable');const x=d.result;el.textContent='Family median: '+money(x.family.median)+' | 10th–90th percentile: '+money(x.family.p10)+' – '+money(x.family.p90)+' | Goal success: '+Math.round(x.family.goal_success*100)+'%. Source: '+d.source+'. '+x.paths+' paths, seed '+x.seed+'. Synthetic assumptions; not a forecast.'}catch(e){el.textContent='Simulation unavailable: '+e.message}}
function eventTimeline(){let ev=(state.events||[]).filter(e=>e.owner===state.viewer).sort((a,b)=>a.date.localeCompare(b.date));return '<section class="card"><h2>📅 Plan your life events</h2><p>Add a future event, when it may happen and how much money it could need.</p><label>Event</label><input id="eventName" placeholder="University, moving home, retirement"><label>Expected date</label><input id="eventDate" type="date"><label>Capital needed ($)</label><input id="eventCost" type="number" min="0" value="5000">'+btn('Add event','addEvent()')+ev.map(e=>'<div class="row"><div><strong>'+esc(e.name)+'</strong><div class="hint">'+esc(e.date)+'</div></div><strong>'+money(e.cost)+'</strong></div>').join('')+'<div class="feed">Total planned capital: <strong>'+money(ev.reduce((a,e)=>a+e.cost,0))+'</strong>. This is a simple total, not yet a Monte Carlo result.</div></section>'}
function addEvent(){let name=document.getElementById('eventName').value.trim(),date=document.getElementById('eventDate').value,cost=Number(document.getElementById('eventCost').value);if(!name||!date||!Number.isFinite(cost)||cost<0){alert('Please provide an event, date and valid cost');return}state.events=state.events||[];state.events.push({name,date,cost,owner:state.viewer});render()}
function askLLM(){let q=document.getElementById('question').value.trim();if(!q)return;if(window.PACT_AUNT_MABEL){window.PACT_AUNT_MABEL.ask(q);return;}let el=document.getElementById('answer');el.classList.remove('hidden');el.textContent='Live LLM answers are not configured. Your question has not been sent to any AI provider. You can explore the synthetic financial data and scenarios in the other tabs.'}

function logChild(action){state.childActivities.push({child:state.viewer,action,time:new Date().toISOString()});save()}
function childHome(){let p=me(),progress=Math.min(100,Math.round(p.saved/p.goal*100));return '<div class="kid-hero"><h1>🚀 Hey '+esc(p.name)+'! Ready for a money adventure?</h1><p>Grow your savings garden, earn stars and learn smart money habits.</p><div class="kid-scenes"><div>🌱<small>Plant a goal</small></div><div>🪙<small>Save coins</small></div><div>🌳<small>Watch it grow</small></div><div>🏆<small>Celebrate!</small></div></div></div><div class="two"><section class="card"><h2>🐷 Your savings jar</h2><div class="metric">'+progress+'% grown!</div><div class="progress"><i style="width:'+progress+'%"></i></div><p>'+money(p.saved)+' of '+money(p.goal)+' in our pretend example.</p></section><section class="card"><h2>🎮 Your next quest</h2><p>Can you spot a need and a want?</p>'+btn('Play the quiz','state.tab=\'learn\';render()')+'</section></div><section class="card"><h2>⭐ Your adventure badges</h2><div class="kid-badges">🌟 Curious explorer　🌱 Savings sprout　🧠 Clever thinker</div><p class="hint">No bank accounts, investment analysis or adult family finances are available in the child view.</p></section>'}
function childLearn(){return '<div class="kid-hero"><h1>🧠 Money adventures</h1><p>Little choices, big ideas. Learn by playing!</p></div><div class="two"><section class="card"><h2>🍎 Need or want?</h2><p>You have $10. Which is usually a need?</p>'+btn('Food for lunch','childAnswer(true,\'Need or want\')')+' '+btn('A new toy','childAnswer(false,\'Need or want\')')+'</section><section class="card"><h2>🐢 The patience challenge</h2><p>You could spend $5 today or save it for something important later. What helps you reach a bigger goal?</p>'+btn('Save it','childAnswer(true,\'Patience challenge\')')+' '+btn('Spend it all','childAnswer(false,\'Patience challenge\')')+'</section><section class="card"><h2>🎁 Giving feels good</h2><p>What is a kind way to help a friend?</p>'+btn('Offer help','childAnswer(true,\'Giving\')')+' '+btn('Share someone else’s secret','childAnswer(false,\'Giving\')')+'</section><section class="card"><h2>🌈 Money words</h2><p><strong>Saving:</strong> keeping money for later.</p><p><strong>Budget:</strong> a plan for spending and saving.</p><p><strong>Goal:</strong> something you are working towards.</p></section></div><p class="hint">Educational play only. No real money, trading, purchases or direct messaging.</p>'}
function childAnswer(correct,topic){logChild('Completed '+topic+' learning question');alert(correct?'🌟 Brilliant! You earned a learning star!':'💛 Good try! Learning means trying again.');render()}
function childSpace(){return '<div class="kid-hero"><h1>🎉 Family cheers</h1><p>Cheer each other on, without sharing private money details.</p></div><section class="card"><h2>💌 Send a family cheer</h2>'+btn('🌟 Great job!','childCheer(\'Great job!\')')+' '+btn('💚 You can do it!','childCheer(\'You can do it!\')')+' '+btn('🎉 Hooray!','childCheer(\'Hooray!\')')+'<p class="hint">Preset messages only. A guardian can review demo activity.</p></section>'}
function childCheer(message){logChild('Sent preset cheer: '+message);alert('Your family cheer was added to your activity!')}
function childFamily(){return '<h1>🏡 My family team</h1><p>Family is a team. Everyone can help in different ways.</p><div class="grid">'+people.map(p=>'<div class="card"><span class="avatar">'+p.icon+'</span><strong>'+esc(p.name)+'</strong><p>'+esc(p.role)+'</p></div>').join('')+'</div><p class="hint">Financial balances and adult conversations are hidden.</p>'}
function guardianPanel(){if(!['dad','mum'].includes(state.viewer))return '';let activities=state.childActivities.slice().reverse();return '<section class="card"><h2>🛡️ Parent & guardian controls</h2><p>Only a parent can add a child under 18 in the intended product. This demonstration does not authenticate parental status.</p><label>Child’s first name</label><input id="childName" placeholder="First name"><label>Child’s age</label><input id="childAge" type="number" min="0" max="17" value="10">'+btn('Register child (demo)','registerChild()')+'<h3>Child activity overview</h3>'+(activities.length?activities.map(a=>'<div class="row">'+esc(a.action)+'<small>'+esc(a.time.slice(0,10))+'</small></div>').join(''):'<p class="hint">No learning activities recorded yet. Switch to Leo and complete a quest to see activity here.</p>')+'<p class="hint">Activity records are browser-session examples, not secure monitoring or identity verification.</p></section>'}
function registerChild(){if(!['dad','mum'].includes(state.viewer)){alert('Only a parent can register a child.');return}let name=document.getElementById('childName').value.trim(),age=Number(document.getElementById('childAge').value);if(!name||!Number.isInteger(age)||age<0||age>=18){alert('Enter a name and age under 18.');return}state.childProfiles.push({name,age,guardian:state.viewer});state.childActivities.push({child:state.viewer,action:'Parent registered child '+name+' (demo)',time:new Date().toISOString()});alert('Child profile recorded for this demo session. Real guardian verification is required before production.');render()}
function resetDemo(){sessionStorage.removeItem('packd_family_demo');state=structuredClone(initial);render()}
document.addEventListener('DOMContentLoaded', render);
</script><script src="/static/aunt-mabel.js" defer></script><script src="/static/pact-maturity.js" defer></script><script src="/static/pact-decision.js" defer></script></body></html>
