<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PACT · Your family, your future</title>
<style>
:root{--ink:#183c3c;--green:#27695b;--mint:#e8f5ed;--cream:#faf8f1;--line:#dfe8e0;--muted:#60716b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--green);color:white}button.secondary{background:#e6eee9;color:var(--ink)}input,select,textarea{padding:11px;border:1px solid #cbd9d0;border-radius:10px;max-width:100%;width:100%}label{display:block;font-weight:650;margin:12px 0 5px}.shell{max-width:1100px;margin:auto;padding:22px}.hero{background:#153f39;color:white;border-radius:24px;padding:40px;max-width:650px;margin:9vh auto}.hero h1{font-size:54px;margin:0}.hero p{font-size:18px;color:#d9ece3}.hero button{background:#d9efbd;color:#173d34}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.muted{color:var(--muted)}small{font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.nav button{background:white;color:var(--ink);border:1px solid var(--line)}.nav button.active{background:var(--green);color:white}.pill{display:inline-block;background:var(--mint);padding:5px 10px;border-radius:30px;font-size:12px}.metric{font-size:29px;font-weight:750}.progress{height:12px;border-radius:20px;background:#e3eae5;overflow:hidden}.progress i{display:block;height:100%;background:#59a47e}.person{display:flex;align-items:center;gap:10px;margin:10px 0}.avatar{font-size:30px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.hidden{display:none!important}.feed{padding:13px;background:#f5f9f5;border-radius:12px;margin:8px 0}.warn{background:#fff4dd;padding:12px;border-radius:12px}.hint{font-size:13px;color:var(--muted)}h1,h2,h3{line-height:1.2}h2{margin-top:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cba34e}@media(max-width:700px){.grid,.two{grid-template-columns:1fr}.hero{margin:2vh auto;padding:28px}.hero h1{font-size:40px}.shell{padding:12px}.top{align-items:start;flex-direction:column}}
 .team-journey{background:linear-gradient(120deg,#173f3b,#3c735b);color:#fff;border-radius:22px;padding:24px;margin-bottom:20px}.team-journey h2{margin:0 0 8px}.team-track{display:flex;align-items:center;justify-content:space-around;gap:8px;margin:20px 0}.team-stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;flex:1}.team-stage .figure{font-size:37px;display:grid;place-items:center;background:#ffffff25;border:2px solid #ffffff50;border-radius:50%;width:76px;height:76px;transition:transform .2s}.team-stage:hover .figure{transform:translateY(-5px) scale(1.08)}.team-stage small{color:#e1f0e5}.team-arrow{font-size:24px;color:#e4d4a0}@media(max-width:600px){.team-track{gap:2px}.team-stage .figure{width:52px;height:52px;font-size:25px}.team-arrow{font-size:14px}} .kid-hero{background:linear-gradient(125deg,#285e85,#6d9f6e);border-radius:22px;padding:28px;color:white;margin-bottom:20px}.kid-hero h1{color:white}.kid-scenes{display:flex;justify-content:space-around;gap:8px;margin-top:22px}.kid-scenes>div{display:flex;flex-direction:column;align-items:center;font-size:40px;background:#ffffff25;padding:12px;border-radius:16px;transition:transform .2s}.kid-scenes>div:hover{transform:translateY(-7px)}.kid-scenes small{font-size:12px}.kid-badges{font-size:24px;line-height:2}@media(max-width:550px){.kid-scenes>div{font-size:26px;padding:5px}.kid-scenes small{font-size:9px}}  .pact-category-nav{margin-bottom:8px}.pact-subnav{margin-bottom:16px;flex-wrap:wrap}.pact-stage-button{border:1px solid #ffffff55;color:#fff;cursor:pointer;background:#ffffff17;border-radius:18px;padding:10px;min-width:0;font:inherit}.pact-stage-button:hover,.pact-stage-button:focus-visible{background:#ffffff35;outline:2px solid #fff}.pact-faq{border-bottom:1px solid #dbe5df;padding:14px 4px}.pact-faq summary{font-weight:700;cursor:pointer}.pact-faq p{margin:10px 0 0}  .pact-consents{margin:12px 0 16px;display:grid;gap:7px}.pact-consents label{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:12px;line-height:1.35;font-weight:400;color:#d5e6dc;cursor:pointer}.pact-consents input[type=checkbox]{appearance:auto;display:inline-block;width:14px;height:14px;min-width:14px;flex:0 0 14px;margin:1px 0 0;padding:0;accent-color:#c5e7c9}.pact-consents a{color:#e4f6df;text-decoration:underline;text-underline-offset:2px} </style></head><body><div id="root"></div>
<script>
const people=[{id:'dad',name:'Daniel',age:48,role:'Dad',icon:'👨',goal:6000,saved:4200},{id:'mum',name:'Amira',age:39,role:'Mum',icon:'👩',goal:4000,saved:2600},{id:'daughter',name:'Maya',age:22,role:'Daughter',icon:'👩‍🎓',goal:3000,saved:1200},{id:'son',name:'Leo',age:8,role:'Son',icon:'👦',goal:200,saved:110},{id:'grandma',name:'Nora',age:67,role:'Grandma',icon:'👵',goal:1500,saved:900},{id:'grandpa',name:'Arthur',age:82,role:'Grandpa',icon:'👴',goal:1000,saved:300}];
const initial={started:false,step:0,account:'',family:'The Morgan Family',viewer:'dad',tab:'home',privacy:{dad:'summary',mum:'summary',daughter:'goals',son:'goals',grandma:'none',grandpa:'none'},feed:[{by:'Maya',message:'I am saving for my first car. Any advice?'},{by:'Amira',message:'Our family savings challenge starts this week!'}],gifts:[],requests:[],challenge:'Savings sprint',events:[],consentAt:null,childActivities:[],childProfiles:[{name:'Leo',age:8,guardian:'dad'}]};
let state;try{state=JSON.parse(sessionStorage.getItem('pact_family_demo'))||structuredClone(initial)}catch(e){state=structuredClone(initial)}
state.childActivities=state.childActivities||[];state.childProfiles=state.childProfiles||[{name:'Leo',age:8,guardian:'dad'}];const root=document.getElementById('root');const save=()=>sessionStorage.setItem('pact_family_demo',JSON.stringify(state));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const me=()=>people.find(p=>p.id===state.viewer);const money=n=>'£'+Number(n).toLocaleString('en-GB');const btn=(name,fn,secondary=false)=>'<button '+(secondary?'class="secondary" ':'')+'onclick="'+fn+'">'+name+'</button>';const help=(title,body)=>'<details><summary>'+title+' ⓘ</summary><p class="hint">'+body+'</p></details>';const childNav=['home','learn','space','family'];const categoryTabs={connect:[['home','Family home'],['family','Our family'],['space','Family space'],['accounts','Accounts & data']],grow:[['portfolio','Portfolio X-ray'],['decisions','What if?'],['risk','Risk & support'],['health','Future plans']],thrive:[['tax','Tax guide'],['faq','FAQs']]};
const childTabs=[['home','My home'],['learn','Money adventures'],['space','Family cheers'],['family','My family'],['faq','FAQs']];
const categoryOf=tab=>Object.keys(categoryTabs).find(k=>categoryTabs[k].some(item=>item[0]===tab))||'connect';
function navigate(tab){state.tab=tab;render()}
function render(){save();if(!state.started)return welcome();const p=me();const kid=p.age<18;if(kid&&!childTabs.some(item=>item[0]===state.tab))state.tab='learn';const category=categoryOf(state.tab);const categories=[['connect','🤝 Connect'],['grow','🌱 Grow'],['thrive','🏡 Thrive']];const subnav=kid?childTabs:categoryTabs[category];root.innerHTML='<div class="shell"><header class="top"><div><strong style="font-size:28px">pact<span style="color:#68a47d">.</span></strong><div class="muted">'+esc(state.family)+' · Fictional demo</div></div><div><label for="viewer">Viewing as</label><select id="viewer" onchange="state.viewer=this.value;state.tab=\'home\';render()">'+people.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+x.icon+' '+x.name+' ('+x.role+')</option>').join('')+'</select></div></header>'+(kid?'<nav class="nav" aria-label="Child activities">'+childTabs.map(item=>'<button class="'+(state.tab===item[0]?'active':'')+'" onclick="navigate(\''+item[0]+'\')">'+item[1]+'</button>').join('')+'</nav>':'<nav class="nav pact-category-nav" aria-label="PACT categories">'+categories.map(item=>'<button class="'+(category===item[0]?'active':'')+'" onclick="navigate(\''+categoryTabs[item[0]][0][0]+'\')">'+item[1]+'</button>').join('')+'</nav><nav class="nav pact-subnav" aria-label="Category features">'+subnav.map(item=>'<button class="'+(state.tab===item[0]?'active':'')+'" onclick="navigate(\''+item[0]+'\')">'+item[1]+'</button>').join('')+'</nav>')+'<main>'+view()+'</main><footer class="hint"><a href="/static/trust.html" target="_blank">Trust Center · Privacy · Terms</a> · PACT interactive concept · Synthetic data only · No real accounts, gifts, transfers or legal risk-sharing arrangements · '+btn('Restart demo','resetDemo()',true)+'</footer></div>';if(state.tab==='portfolio')queueMicrotask(()=>window.PACT_ANALYTICS?.render())}
function welcome(){let s=state.step;root.innerHTML='<div class="hero"><h1>pact.</h1><p>Money is personal. Family is everything. Plan, save and support each other — on your terms.</p>'+ (s===0?'<p>See how your family can make better money decisions together.</p>'+btn('Create my family','state.step=1;render()')+' '+btn('Sign in to demo','state.step=3;render()',true):s===1?'<h2>Let’s start with you</h2><label>Your name</label><input id="newname" placeholder="Your first name" value="'+esc(state.account)+'"><label>Email (optional in this demo)</label><input placeholder="you@example.com" type="email"><p class="hint">No password or verification required. Nothing is sent to a server.</p>'+btn('Continue','state.account=document.getElementById(\'newname\').value||\'Demo user\';state.step=2;render()'):s===2?'<h2>Build your family circle</h2><label>Family name</label><input id="famname" value="'+esc(state.family)+'"><p>We’ve prepared six fictional family members to explore different life stages.</p>'+people.map(p=>'<div>'+p.icon+' '+p.name+' · '+p.role+', '+p.age+'</div>').join('')+'<p>'+btn('Create family','state.family=document.getElementById(\'famname\').value||\'My Family\';state.step=3;render()')+'</p>':'<h2>Choose what you share</h2><p>You can be part of the family without sharing your finances. Every person controls their own information.</p><label>Your starting preference</label><select id="privacy"><option value="none">Keep everything private</option><option value="goals">Share selected goals only</option><option value="summary">Share a summary</option></select><p>'+'<div class="pact-consents"><label><input type="checkbox" id="agreeTerms"><span>I accept the <a href="/static/trust.html" target="_blank" rel="noopener">Privacy Policy and Demo Terms</a>.</span></label><label><input type="checkbox" id="agreeConfidential"><span>I will not submit real or confidential financial information.</span></label><label><input type="checkbox" id="agreeAi"><span>Allow Nicrron AI to process demo questions (optional).</span></label></div><p>'+btn('Enter family home','enterWithConsent()')+'</p>')+'</div>'}
function enterWithConsent(){if(!document.getElementById('agreeTerms').checked||!document.getElementById('agreeConfidential').checked){alert('Please review and accept the demo terms and confidentiality notice.');return}state.privacy.dad=document.getElementById('privacy').value;state.aiConsent=document.getElementById('agreeAi').checked;state.consentAt=new Date().toISOString();state.started=true;render()}
function view(){switch(state.tab){case'home':return me().age<18?childHome():home();case'learn':return childLearn();case'space':return me().age<18?childSpace():space();case'family':return me().age<18?childFamily():family();case'portfolio':return portfolio();case'decisions':return decisions();case'risk':return risk();case'health':return health();case'tax':return tax();case'accounts':return accounts();case'faq':return faq();default:return faq()}}
function teamGraphic(){return '<section class="team-journey"><h2>🌱 Better together</h2><p>Explore PACT through three connected experiences. Select a stage to see its tools.</p><div class="team-track">'+[['connect','🤝','Connect','Family, sharing and accounts'],['grow','🌱','Grow','Portfolios, risk and simulation'],['thrive','🏡','Thrive','Guidance, tax and FAQs']].map((item,i)=>'<button type="button" class="team-stage pact-stage-button" onclick="navigate(\''+categoryTabs[item[0]][0][0]+'\')"><span class="figure">'+item[1]+'</span><strong>'+item[2]+'</strong><small>'+item[3]+'</small></button>'+(i<2?'<span class="team-arrow" aria-hidden="true">➜</span>':'')).join('')+'</div></section>'}
function home(){let p=me(),kid=p.age<18,young=p.age<26,senior=p.age>75;return '<h1>Hi '+p.name+' 👋</h1><p class="muted">'+(kid?'Let’s grow your savings jar!':young?'Your money, your future. One step at a time.':senior?'Your important money reminders and family updates, all in one place.':'Here’s what matters to your family this week.')+'</p>'+teamGraphic()+'<div class="grid"><section class="card"><span class="pill">Your savings goal</span><div class="metric">'+Math.round(p.saved/p.goal*100)+'%</div><div class="progress"><i style="width:'+Math.min(100,p.saved/p.goal*100)+'%"></i></div><p class="hint">'+money(p.saved)+' saved towards '+money(p.goal)+' · Your own synthetic goal</p></section><section class="card"><span class="pill">Family challenge</span><h3>Save together this month</h3><p>Celebrate progress, not who has the most money.</p>'+btn('See challenge','state.tab=\'space\';render()')+'</section><section class="card"><span class="pill">Upcoming</span><h3>Insurance renewal</h3><p>Grandma · Due in 12 days</p>'+btn('View family reminders','state.tab=\'family\';render()',true)+'</section></div><div class="two"><section class="card"><h2>Things worth talking about</h2><div class="row">💬 Maya is saving for a car</div><div class="row">🛟 Could your family cover an unexpected expense?</div><div class="row">🎁 Send encouragement or a gift</div>'+btn('Go to Family Space','state.tab=\'space\';render()')+'</section><section class="card"><h2>Your financial picture</h2><p>Only information you have permission to see is shown.</p>'+(kid?'<p class="hint">Your savings jar is ready. Adult finances are not visible in this view.</p>':young?'<p>Start with your own goals. Household financial details are not shown.</p>':'<p>Explore the shared family finances and areas that may need attention.</p>'+help('What does family wealth mean?','The value of assets minus debts. This illustration includes home equity. Only data authorised for sharing should be included.'))+btn('Explore money picture','state.tab=\'portfolio\';render()',true)+'</section></div>'}
function space(){let visible=people.filter(p=>p.age>=18||p.id==='son');return '<h1>Family Space 🎉</h1><p>Celebrate progress, exchange ideas and help each other. Sharing balances is always optional.</p><div class="two"><section class="card"><h2>🏆 Savings sprint</h2><p class="hint">Ranked by % of personal goal reached — never by net worth. Private members can opt out.</p>'+visible.filter(p=>state.privacy[p.id]!=='none').sort((a,b)=>b.saved/b.goal-a.saved/a.goal).map((p,i)=>'<div class="row"><span>'+(i+1)+'. '+p.icon+' '+p.name+'</span><strong>'+Math.round(p.saved/p.goal*100)+'%</strong></div>').join('')+btn('Celebrate a member','giftForm()')+'</section><section class="card"><h2>🎁 Send a gift</h2><p class="hint">Demo-only gift pledges. No payment or transfer takes place.</p><label>To</label><select id="giftTo">'+people.filter(p=>p.id!==state.viewer).map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select><label>Gift type</label><select id="giftType"><option>Encouragement 🎉</option><option>Birthday gift pledge 🎁</option><option>Savings contribution pledge 💚</option></select><label>Message</label><input id="giftMessage" placeholder="Proud of your progress!">'+btn('Send demo gift','sendGift()')+'</section></div><div class="two"><section class="card"><h2>💬 Family conversation</h2>'+state.feed.slice().reverse().map(f=>'<div class="feed"><strong>'+esc(f.by)+'</strong><p>'+esc(f.message)+'</p></div>').join('')+'<label>Share an update</label><textarea id="post" rows="2" placeholder="Ask a question or celebrate a milestone"></textarea>'+btn('Post to family','postFeed()')+'</section><section class="card"><h2>🤝 Ask for support</h2><p>Ask for advice, time or a voluntary gift pledge.</p><label>What would help?</label><select id="requestType"><option>Advice</option><option>Help with an unexpected expense</option><option>Saving for a goal</option><option>Practical help</option></select><label>Tell your family</label><textarea id="requestText" rows="2" placeholder="What support are you looking for?"></textarea>'+btn('Share request','sendRequest()')+state.requests.map(x=>'<div class="feed">'+esc(x)+'</div>').join('')+'</section></div>'}
function family(){return guardianPanel()+'<h1>Our family circle</h1><p>Everyone belongs. Everyone decides what they share.</p><div class="grid">'+people.map(p=>'<div class="card"><div class="person"><span class="avatar">'+p.icon+'</span><div><strong>'+p.name+'</strong><div class="muted">'+p.role+' · '+p.age+'</div></div></div><span class="pill">'+(state.privacy[p.id]==='none'?'Private':state.privacy[p.id]==='goals'?'Goals only':'Summary shared')+'</span></div>').join('')+'</div><section class="card"><h2>Your sharing controls</h2><p>Choose what other family members can see about you.</p><select id="share"><option value="none">Keep my finances private</option><option value="goals">Share goals and updates only</option><option value="summary">Share a financial summary</option></select> '+btn('Save my preference','state.privacy[state.viewer]=document.getElementById(\'share\').value;render()')+'<p class="hint">This prototype demonstrates sharing choices in one browser session. Real multi-user authorisation is not implemented.</p></section><section class="card"><h2>Reminders</h2><div class="row">Grandma · Insurance renewal · 12 days</div><div class="row">Dad · Review emergency savings · This month</div><div class="row">Maya · Car savings check-in · Next week</div></section><section class="card"><h2>Extended family circles</h2><p>Coming later: invite cousins and other households to a separate circle, with separate permissions and support requests.</p></section>'}
function portfolio(){if(me().age<26)return '<div id="pact-analytics"></div>'+holdingsView()+'<h1>My money</h1><div class="card"><h2>Your savings progress</h2><div class="metric">'+Math.round(me().saved/me().goal*100)+'%</div><p>Your personal savings goal. Family account balances are not visible.</p></div>';return '<div id="pact-analytics"></div>'+holdingsView()+'<h1>Where is the family money?</h1><p>Illustrative shared household figures, not a live account aggregation.</p><div class="grid"><div class="card"><h3>Family wealth estimate</h3><div class="metric">£285,000</div>'+help('How is this calculated?','Assets less debts, including an illustrative share of home equity. Real aggregates must exclude unconsented private assets.')+'</div><div class="card"><h3>Savings and investments</h3><div class="metric">£42,000</div>'+help('What is included?','Illustrative accessible savings and investment accounts, excluding property.')+'</div><div class="card"><h3>Annual money left over</h3><div class="metric">£7,200</div>'+help('What is this?','Illustrative household income minus estimated spending over a year. Not guaranteed savings.')+'</div></div><div class="card"><h2>What deserves attention?</h2><p>⚠️ Some family savings may be exposed to market falls. An emergency buffer can help avoid selling investments at a bad time.</p><p class="hint">Advanced portfolio calculations are available in the original research MVP. This family view is a simplified synthetic concept.</p></div>'}
function decisions(){return '<h1>What if…?</h1><p>Explore possible decisions without needing to understand financial modelling.</p><div class="card"><label>Choose a question</label><select id="scenario"><option>What if Dad loses his job?</option><option>Can Maya afford a first car?</option><option>What if we help Grandma with an unexpected bill?</option><option>What if markets fall by 20%?</option></select><label>Estimated expense or lost income (£)</label><input id="amount" type="number" min="0" value="3000">'+btn('Explore scenario','scenarioResult()')+'<div id="scenarioResult" class="feed hidden"></div></div>'}
function risk(){return '<h1>Risk & family support 🛟</h1><p>Risk means things that could make money plans harder — such as losing income, surprise bills or falling investments.</p><div class="two"><div class="card"><h2>How comfortable are you with risk?</h2><p>Choose what feels closest to you.</p><select id="appetite"><option>I prefer certainty, even if growth is slower</option><option>I can accept some ups and downs</option><option>I can tolerate bigger changes for possible long-term growth</option></select>'+btn('Save my preference','alert(\'Saved for this demonstration. This is not an investment suitability assessment.\')')+'<p class="hint">Your preference is not a recommendation to buy or sell investments.</p></div><div class="card"><h2>Share support, not liabilities</h2><p>Offer advice, a voluntary emergency-support pledge, or help planning a financial buffer.</p><label>Support I can offer</label><select id="riskSupport"><option>Advice and encouragement</option><option>Help review an emergency plan</option><option>Voluntary support pledge</option></select>'+btn('Share with family','state.feed.push({by:me().name,message:\'I can offer: \'+document.getElementById(\'riskSupport\').value});state.tab=\'space\';render()')+'<p class="hint">No binding guarantees, debt transfers or investment risk pooling.</p></div></div><div class="card"><h2>Things to keep an eye on</h2><div class="row">🏠 Relying on one main household income</div><div class="row">💧 Having enough emergency cash</div><div class="row">📉 Investments falling when money is needed</div>'+help('See how risk can be calculated','The research engine uses covariance, portfolio weights, constraints and Monte Carlo projections. Those calculations must be tied to permissioned source data before production use.')+'</div>'}
function health(){return '<section class="card"><h2>🔬 Run a reproducible portfolio simulation</h2><p>Run the separate synthetic research benchmark with 1,000 correlated market paths. The results use a fixed random seed and can be traced to engine.py.</p><label>Years</label><input type="number" id="simYears" min="1" max="30" value="10"><label><input type="checkbox" id="simCrash"> Include a first-year market shock</label>'+btn('Run Monte Carlo','runPactSimulation()')+'<div id="simOutput" class="feed"></div></section>'+eventTimeline()+'<h1>Your future plans</h1><div class="card"><h2>Could your savings last?</h2><p>Financial projections explore a range of possible futures, not one guaranteed answer.</p><p>Our research engine uses Monte Carlo simulation to explore thousands of possible market paths. The full technical engine remains in the existing PACT research dashboard.</p>'+help('What is Monte Carlo?','A method that tests many possible future paths using assumptions about returns and uncertainty. Results depend on the assumptions and are not predictions.')+'</div>'}
function tax(){return '<h1>Tax guide</h1><div class="card"><h2>Understand your allowances</h2><p>Explore the tax treatment of savings and investments, and questions worth checking before making a decision.</p><p class="warn">This demo does not calculate live tax liabilities or personalised tax savings. Tax rules depend on your circumstances and jurisdiction.</p></div>'}
function accounts(){return '<h1>Accounts & data</h1><p>Bring your finances together, while deciding what stays private.</p><div class="card"><h2>Connect your bank with Plaid</h2><p>Secure, consent-based bank connections are planned.</p>'+btn('Connect with Plaid','window.PACT_PLAID()')+'<p class="hint">Demo placeholder. No live account connection.</p></div><div class="grid">'+['Bank account','Investment platform (e.g. eToro)','Pension','Manual entry'].map(x=>'<div class="card"><h3>'+x+'</h3><p class="hint">Synthetic demo connector</p>'+btn('Preview connection','alert(\'Demo only: no real account is linked and no credentials are collected.\')',true)+'</div>').join('')+'</div><p class="warn">Never enter real banking passwords, account numbers or personal financial information in this prototype.</p>'}
function faq(){const questions=[['What is PACT?','PACT helps a family understand shared and individual finances while respecting each member’s privacy.'],['How does top-down and bottom-up analysis work?','Top-down analysis starts with family allocation and risk. Bottom-up analysis traces contributions from each member, account and asset class. Open Grow → Portfolio X-ray to inspect the traceable synthetic benchmark.'],['Is the portfolio real?','No. The hackathon benchmark is synthetic, and the sample ETF and stock positions are illustrative. Calculations are derived from explicit benchmark inputs, not live bank balances.'],['How do I connect an account?','Go to Connect → Accounts & data. Plaid is not yet connected for live authorization. The demo will not collect bank passwords.'],['How do simulations work?','Go to Grow → Future plans and run the reproducible Monte Carlo benchmark. Personal life events are recorded separately and are not yet fed into that engine.'],['Where can I ask an AI question?','Enable Aunt Mabel using the small control in the bottom-right corner. Consent is required before a question is sent to Nicrron.'],['Can a child see my portfolio?','The child interface excludes adult investment screens. This synthetic demo is not secure parental authentication; production controls require server-side enforcement.'],['What is PRISM?','When configured, PRISM receives redacted metadata about Nicrron AI calls for traceability. A trace does not independently verify the answer.']];return '<h1>Frequently asked questions</h1><p>Quick answers to common questions. For personalised portfolio questions, use Aunt Mabel.</p><div class="card">'+questions.map(([q,a])=>'<details class="pact-faq"><summary>'+q+'</summary><p>'+a+'</p></details>').join('')+'</div><p><a href="/static/trust.html" target="_blank" rel="noopener">Read the Trust Center and Privacy Policy</a></p>'}
function answer(){let q=document.getElementById('question').value.toLowerCase();let a=q.includes('risk')?'Risk is the possibility that your money plans do not go as expected. Think about emergency cash, income stability and investment ups and downs.':q.includes('tax')?'Tax depends on where you live and your personal circumstances. PACT can help you identify questions to check, but this demo does not provide tax advice.':q.includes('save')?'Start with a goal, set aside a manageable amount regularly and review your progress. You can join a family challenge without revealing balances.':'PACT helps families set goals, share only what they choose and discuss financial decisions. Ask about savings, risk or tax.';let el=document.getElementById('answer');el.classList.remove('hidden');el.textContent=a}
function scenarioResult(){let e=document.getElementById('scenario').value,amount=Number(document.getElementById('amount').value)||0,el=document.getElementById('scenarioResult');el.classList.remove('hidden');el.textContent='Illustrative scenario: '+e+' A £'+amount.toLocaleString('en-GB')+' change would reduce available cash by that amount before any other effects. This is a simple cash-impact illustration, not a completed Monte Carlo result or financial advice.'}
function postFeed(){let v=document.getElementById('post').value.trim();if(v){state.feed.push({by:me().name,message:v});render()}}
function sendGift(){let p=people.find(p=>p.id===document.getElementById('giftTo').value);state.feed.push({by:me().name,message:'Sent '+p.name+' a demo '+document.getElementById('giftType').value.toLowerCase()+': '+document.getElementById('giftMessage').value});render()}
function sendRequest(){let v=document.getElementById('requestText').value.trim();if(v){state.requests.push(me().name+': '+document.getElementById('requestType').value+' — '+v);state.feed.push({by:me().name,message:'Support request: '+v});render()}}
function giftForm(){document.getElementById('giftTo').focus()}

async function runPactSimulation(){const el=document.getElementById('simOutput');const years=Number(document.getElementById('simYears').value),crash=document.getElementById('simCrash').checked;el.textContent='Running…';try{const r=await fetch('/api/public/simulation?years='+years+'&crash='+crash);const d=await r.json();if(!r.ok)throw Error(d.detail||'Unavailable');const x=d.result;el.textContent='Family median: '+money(x.family.median)+' | 10th–90th percentile: '+money(x.family.p10)+' – '+money(x.family.p90)+' | Goal success: '+Math.round(x.family.goal_success*100)+'%. Source: '+d.source+'. '+x.paths+' paths, seed '+x.seed+'. Synthetic assumptions; not a forecast.'}catch(e){el.textContent='Simulation unavailable: '+e.message}}
function eventTimeline(){let ev=(state.events||[]).filter(e=>e.owner===state.viewer).sort((a,b)=>a.date.localeCompare(b.date));return '<section class="card"><h2>📅 Plan your life events</h2><p>Add a future event, when it may happen and how much money it could need.</p><label>Event</label><input id="eventName" placeholder="University, moving home, retirement"><label>Expected date</label><input id="eventDate" type="date"><label>Capital needed (£)</label><input id="eventCost" type="number" min="0" value="5000">'+btn('Add event','addEvent()')+ev.map(e=>'<div class="row"><div><strong>'+esc(e.name)+'</strong><div class="hint">'+esc(e.date)+'</div></div><strong>'+money(e.cost)+'</strong></div>').join('')+'<div class="feed">Total planned capital: <strong>'+money(ev.reduce((a,e)=>a+e.cost,0))+'</strong>. This is a simple total, not yet a Monte Carlo result.</div></section>'}
function addEvent(){let name=document.getElementById('eventName').value.trim(),date=document.getElementById('eventDate').value,cost=Number(document.getElementById('eventCost').value);if(!name||!date||!Number.isFinite(cost)||cost<0){alert('Please provide an event, date and valid cost');return}state.events=state.events||[];state.events.push({name,date,cost,owner:state.viewer});render()}
function holdingsView(){let h=[['VWRP','Global equity ETF','dad','Stocks & Shares ISA',28,108],['VUAG','S&P 500 ETF','mum','Stocks & Shares ISA',34,89],['AAPL','Apple','dad','General Investment Account',8,190],['MSFT','Microsoft','daughter','General Investment Account',3,350],['VWRP','Global equity ETF','daughter','Stocks & Shares ISA',6,108],['TSLA','Tesla','mum','General Investment Account',4,215]];let visible=h.filter(x=>x[2]===state.viewer||(me().age>=26&&state.privacy[x[2]]==='summary'));let total=visible.reduce((a,x)=>a+x[4]*x[5],0);return '<section class="card"><h2>📊 Family holdings</h2><p class="hint">Illustrative ETF and stock positions. Fictional prices in GBP; only permitted positions shown.</p><div class="metric">'+money(total)+'</div><p class="hint">Total of visible sample positions, not the complete family portfolio.</p>'+visible.map(x=>'<div class="row"><div><strong>'+esc(x[0])+'</strong> · '+esc(x[1])+'<div class="hint">'+esc(people.find(p=>p.id===x[2]).name)+' · '+esc(x[3])+' · '+x[4]+' units</div></div><strong>'+money(x[4]*x[5])+'</strong></div>').join('')+'<details><summary>Break down by family member</summary>'+people.filter(p=>visible.some(x=>x[2]===p.id)).map(p=>'<div class="row">'+esc(p.name)+'<strong>'+money(visible.filter(x=>x[2]===p.id).reduce((a,x)=>a+x[4]*x[5],0))+'</strong></div>').join('')+'</details><details><summary>Break down by account type</summary>'+[...new Set(visible.map(x=>x[3]))].map(t=>'<div class="row">'+esc(t)+'<strong>'+money(visible.filter(x=>x[3]===t).reduce((a,x)=>a+x[4]*x[5],0))+'</strong></div>').join('')+'</details></section>'}
function askLLM(){let q=document.getElementById('question').value.trim();if(!q)return;if(window.PACT_AUNT_MABEL){window.PACT_AUNT_MABEL.ask(q);return;}let el=document.getElementById('answer');el.classList.remove('hidden');el.textContent='Live LLM answers are not configured. Your question has not been sent to any AI provider. You can explore the synthetic financial data and scenarios in the other tabs.'}

function logChild(action){state.childActivities.push({child:state.viewer,action,time:new Date().toISOString()});save()}
function childHome(){let p=me(),progress=Math.min(100,Math.round(p.saved/p.goal*100));return '<div class="kid-hero"><h1>🚀 Hey '+esc(p.name)+'! Ready for a money adventure?</h1><p>Grow your savings garden, earn stars and learn smart money habits.</p><div class="kid-scenes"><div>🌱<small>Plant a goal</small></div><div>🪙<small>Save coins</small></div><div>🌳<small>Watch it grow</small></div><div>🏆<small>Celebrate!</small></div></div></div><div class="two"><section class="card"><h2>🐷 Your savings jar</h2><div class="metric">'+progress+'% grown!</div><div class="progress"><i style="width:'+progress+'%"></i></div><p>'+money(p.saved)+' of '+money(p.goal)+' in our pretend example.</p></section><section class="card"><h2>🎮 Your next quest</h2><p>Can you spot a need and a want?</p>'+btn('Play the quiz','state.tab=\'learn\';render()')+'</section></div><section class="card"><h2>⭐ Your adventure badges</h2><div class="kid-badges">🌟 Curious explorer　🌱 Savings sprout　🧠 Clever thinker</div><p class="hint">No bank accounts, investment analysis or adult family finances are available in the child view.</p></section>'}
function childLearn(){return '<div class="kid-hero"><h1>🧠 Money adventures</h1><p>Little choices, big ideas. Learn by playing!</p></div><div class="two"><section class="card"><h2>🍎 Need or want?</h2><p>You have £10. Which is usually a need?</p>'+btn('Food for lunch','childAnswer(true,\'Need or want\')')+' '+btn('A new toy','childAnswer(false,\'Need or want\')')+'</section><section class="card"><h2>🐢 The patience challenge</h2><p>You could spend £5 today or save it for something important later. What helps you reach a bigger goal?</p>'+btn('Save it','childAnswer(true,\'Patience challenge\')')+' '+btn('Spend it all','childAnswer(false,\'Patience challenge\')')+'</section><section class="card"><h2>🎁 Giving feels good</h2><p>What is a kind way to help a friend?</p>'+btn('Offer help','childAnswer(true,\'Giving\')')+' '+btn('Share someone else’s secret','childAnswer(false,\'Giving\')')+'</section><section class="card"><h2>🌈 Money words</h2><p><strong>Saving:</strong> keeping money for later.</p><p><strong>Budget:</strong> a plan for spending and saving.</p><p><strong>Goal:</strong> something you are working towards.</p></section></div><p class="hint">Educational play only. No real money, trading, purchases or direct messaging.</p>'}
function childAnswer(correct,topic){logChild('Completed '+topic+' learning question');alert(correct?'🌟 Brilliant! You earned a learning star!':'💛 Good try! Learning means trying again.');render()}
function childSpace(){return '<div class="kid-hero"><h1>🎉 Family cheers</h1><p>Cheer each other on, without sharing private money details.</p></div><section class="card"><h2>💌 Send a family cheer</h2>'+btn('🌟 Great job!','childCheer(\'Great job!\')')+' '+btn('💚 You can do it!','childCheer(\'You can do it!\')')+' '+btn('🎉 Hooray!','childCheer(\'Hooray!\')')+'<p class="hint">Preset messages only. A guardian can review demo activity.</p></section>'}
function childCheer(message){logChild('Sent preset cheer: '+message);alert('Your family cheer was added to your activity!')}
function childFamily(){return '<h1>🏡 My family team</h1><p>Family is a team. Everyone can help in different ways.</p><div class="grid">'+people.map(p=>'<div class="card"><span class="avatar">'+p.icon+'</span><strong>'+esc(p.name)+'</strong><p>'+esc(p.role)+'</p></div>').join('')+'</div><p class="hint">Financial balances and adult conversations are hidden.</p>'}
function guardianPanel(){if(!['dad','mum'].includes(state.viewer))return '';let activities=state.childActivities.slice().reverse();return '<section class="card"><h2>🛡️ Parent & guardian controls</h2><p>Only a parent can add a child under 18 in the intended product. This demonstration does not authenticate parental status.</p><label>Child’s first name</label><input id="childName" placeholder="First name"><label>Child’s age</label><input id="childAge" type="number" min="0" max="17" value="10">'+btn('Register child (demo)','registerChild()')+'<h3>Child activity overview</h3>'+(activities.length?activities.map(a=>'<div class="row">'+esc(a.action)+'<small>'+esc(a.time.slice(0,10))+'</small></div>').join(''):'<p class="hint">No learning activities recorded yet. Switch to Leo and complete a quest to see activity here.</p>')+'<p class="hint">Activity records are browser-session examples, not secure monitoring or identity verification.</p></section>'}
function registerChild(){if(!['dad','mum'].includes(state.viewer)){alert('Only a parent can register a child.');return}let name=document.getElementById('childName').value.trim(),age=Number(document.getElementById('childAge').value);if(!name||!Number.isInteger(age)||age<0||age>=18){alert('Enter a name and age under 18.');return}state.childProfiles.push({name,age,guardian:state.viewer});state.childActivities.push({child:state.viewer,action:'Parent registered child '+name+' (demo)',time:new Date().toISOString()});alert('Child profile recorded for this demo session. Real guardian verification is required before production.');render()}
function resetDemo(){sessionStorage.removeItem('pact_family_demo');state=structuredClone(initial);render()}
render();
</script><script src="/static/aunt-mabel.js" defer></script><script src="/static/pact-maturity.js" defer></script></body></html>
